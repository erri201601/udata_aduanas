# ADUANERO OS — Alembic.
# La URL NO se escribe aquí: se lee de .env vía apps.api.config (§40).
# Todo cambio de esquema pasa por aquí (§10.4 y §10.5 Persona 1).

[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC
# Migraciones nombradas por fecha: el orden es legible sin abrir los archivos.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
