# ADUANERO OS — Alembic.
# La URL NO se escribe aquí: se lee de .env vía apps.api.config (§40).
# Todo cambio de esquema pasa por aquí (§10.4 y §10.5 Persona 1).

[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC
# Migraciones nombradas por fecha: el orden es legible sin abrir los archivos.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# type = module y no console_scripts ni exec.
#   console_scripts -> alembic busca un entry point de setuptools que ruff, al
#       distribuirse como binario, no siempre expone: aborta con "Could not
#       find entrypoint console_scripts.ruff" DESPUÉS de escribir el archivo.
#   exec -> depende de que ruff esté en el PATH, así que falla si invocas
#       .venv/bin/alembic sin haber activado el entorno.
#   module -> lo ejecuta con el mismo intérprete que corre alembic, de modo que
#       usa el ruff de ese entorno. Funciona igual en la laptop y en CI.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
